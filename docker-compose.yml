name: zhituo-ai

services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: postgresql+psycopg://zhituo:${POSTGRES_PASSWORD:-zhituo_dev}@postgres:5432/${POSTGRES_DB:-zhituo}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8766,http://localhost:8766}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-127.0.0.1,localhost,api}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-change-me}
      QCC_APP_KEY: ${QCC_APP_KEY:-}
      QCC_SECRET_KEY: ${QCC_SECRET_KEY:-}
      TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
      python -m app.scripts.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"
      interval: 10s
      timeout: 3s
      retries: 8

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhituo}
      POSTGRES_USER: zhituo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhituo_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhituo -d ${POSTGRES_DB:-zhituo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
