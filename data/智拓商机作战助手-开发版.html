<!DOCTYPE html>
<!-- 组织身份与五级数据共享完整版本 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="智拓商机作战助手：组织身份识别、区域数据共享、新客与猎户经营管理。">
  <title>智拓 · 商机作战助手</title>
  <style>
    :root{
      /* China Mobile brand */
      --cmcc-blue:#0085D0;--cmcc-blue-hover:#0076BA;--cmcc-blue-dark:#006DAF;--cmcc-blue-light:#EAF7FD;
      --cmcc-green:#78B82A;--cmcc-green-light:#F0F8E5;
      /* Neutral and semantic */
      --gray-900:#101828;--gray-700:#344054;--gray-600:#475467;--gray-500:#667085;--gray-400:#98A2B3;--gray-300:#D0D5DD;--gray-200:#EAECF0;--gray-100:#F2F4F7;--gray-50:#F9FAFB;
      --blue:var(--cmcc-blue);--blue-700:var(--cmcc-blue-dark);--blue-50:var(--cmcc-blue-light);--green:var(--cmcc-green);--green-50:var(--cmcc-green-light);
      --ink:var(--gray-900);--text:var(--gray-600);--muted:var(--gray-500);--line:var(--gray-200);--bg:#F6F8FA;--card:#FFFFFF;
      --orange:#D97706;--orange-50:#FFF7E8;--red:#D64550;--red-50:#FFF1F2;--purple:#667085;
      /* Shape, elevation and layout */
      --radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius:10px;
      --shadow-sm:0 1px 2px rgba(16,24,40,.04);--shadow:0 12px 32px rgba(16,24,40,.14);--sidebar:240px;--topbar:68px
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(circle at 86% 2%,rgba(0,133,208,.08),transparent 27%),linear-gradient(180deg,#f5fafc 0,var(--bg) 38%,#f7fafb 100%);color:var(--ink);font:14px/1.5 "Microsoft YaHei","PingFang SC",Arial,sans-serif}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .topbar{height:var(--topbar);position:fixed;z-index:80;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:rgba(255,255,255,.94);border-bottom:1px solid rgba(0,133,208,.14);box-shadow:0 7px 26px rgba(25,80,113,.06);backdrop-filter:blur(16px)}
    .topbar:after{content:"";position:absolute;inset:auto 0 -1px;height:2px;background:linear-gradient(90deg,var(--blue),#35a7df 66%,var(--green))}
    .brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:800}
    .brand-mark{position:relative;width:39px;height:39px;display:grid;place-items:center;border-radius:13px;color:#fff;background:linear-gradient(145deg,#00a2e2,var(--blue) 58%,#0067aa);box-shadow:0 8px 20px rgba(0,133,208,.27)}
    .brand-mark:after{content:"";position:absolute;right:4px;bottom:4px;width:9px;height:9px;border:2px solid #fff;border-radius:50%;background:var(--green);box-shadow:-9px -8px 0 -3px rgba(255,255,255,.9)}
    .brand small{display:block;margin-top:1px;color:var(--muted);font-size:10px;font-weight:400}
    .cmcc-logo-top{width:132px;height:auto;display:block;flex:none}
    .brand-divider{width:1px;height:34px;margin:0 2px;background:#d9e6ee}
    .cmcc-chip{display:inline-flex;align-items:center;gap:6px;margin-left:5px;padding:5px 9px;border:1px solid #cae7f4;border-radius:999px;background:linear-gradient(90deg,#f1fbff,#f6fbea);color:#167aa9;font-size:10px;font-weight:800;letter-spacing:.3px}
    .cmcc-chip i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(120,184,42,.13)}
    .top-actions{display:flex;align-items:center;gap:10px}
    .profile{display:flex;align-items:center;gap:9px;padding:5px 8px;border:0;border-radius:10px;background:transparent;color:var(--text);text-align:left}
    .profile:hover{background:#f5f8fc}
    .profile-org{display:block;max-width:230px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:10px}
    .avatar{width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:50%;background:#dceaff;color:var(--blue);font-weight:800}
    .shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh;padding-top:var(--topbar)}
    .sidebar{position:fixed;z-index:70;top:var(--topbar);bottom:0;left:0;width:var(--sidebar);padding:18px 14px;background:linear-gradient(180deg,#063f6b 0,#075889 52%,#087a9e 100%);border-right:0;overflow:auto;box-shadow:9px 0 30px rgba(5,62,100,.12)}
    .nav-label{margin:8px 12px;color:rgba(255,255,255,.5);font-size:10px;letter-spacing:1.2px}
    .nav-btn{width:100%;display:flex;align-items:center;gap:10px;margin:4px 0;padding:10px 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:rgba(255,255,255,.78);text-align:left}
    .nav-btn:hover{border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.08);color:#fff}
    .nav-btn.active{border-color:rgba(255,255,255,.17);background:linear-gradient(90deg,rgba(255,255,255,.19),rgba(255,255,255,.08));color:#fff;font-weight:800;box-shadow:inset 3px 0 0 #a8d94a}
    .nav-icon{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.1);font-size:12px}
    .nav-btn.active .nav-icon{background:#fff;color:var(--blue)}
    .nav-count{margin-left:auto;min-width:23px;padding:2px 6px;border-radius:999px;background:#eef1f6;color:#718096;font-size:10px;text-align:center}
    .sidebar-foot{margin:22px 8px 0;padding:14px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.09);color:rgba(255,255,255,.72);font-size:11px;line-height:1.65;backdrop-filter:blur(8px)}
    .sidebar-foot b{display:block;color:#d9f1a8;font-size:12px}
    .sidebar-brand{margin:0 5px 19px;padding:12px;border:1px solid rgba(255,255,255,.14);border-radius:13px;background:rgba(255,255,255,.96);box-shadow:0 10px 25px rgba(0,36,65,.14)}
    .sidebar-brand img{display:block;width:100%;height:auto}
    .sidebar-brand span{display:block;margin-top:7px;padding-top:7px;border-top:1px solid #e6eef3;color:#577287;font-size:10px;font-weight:800;text-align:center;letter-spacing:.3px}
    main{grid-column:2;min-width:0;width:100%;max-width:1580px;margin:0 auto;padding:27px 31px 60px}
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}
    .eyebrow{display:flex;align-items:center;gap:7px;margin-bottom:6px;color:var(--blue);font-size:10px;font-weight:900;letter-spacing:1.2px}
    .eyebrow:before{content:"";width:22px;height:3px;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--green))}
    h1{margin:0;font-size:25px;line-height:1.25}
    .subtitle{margin:6px 0 0;color:var(--muted);font-size:12px}
    .head-actions,.row-actions,.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .scope-pill{display:inline-flex;align-items:center;gap:6px;max-width:390px;padding:7px 10px;border:1px solid #d7e5f8;border-radius:8px;background:#f7fbff;color:var(--blue);font-size:11px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-weight:700;font-size:12px}
    .btn:hover{border-color:#b9c9dd;background:#f9fbfd}
    .btn-primary{border-color:var(--blue);background:linear-gradient(135deg,#0299dc,var(--blue));color:#fff;box-shadow:0 7px 16px rgba(0,133,208,.2)}
    .btn-primary:hover{background:var(--blue-700)}
    .btn-danger{border-color:#efc7cb;color:var(--red)}
    .btn-sm{min-height:30px;padding:5px 9px;font-size:11px}
    .icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text)}
    .card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 7px 22px rgba(16,74,111,.045)}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 19px 13px}
    .panel-head h2{margin:0;font-size:16px}
    .panel-head p{margin:3px 0 0;color:var(--muted);font-size:11px}
    .panel-link{border:0;background:transparent;color:var(--blue);font-size:11px}
    .section-gap{margin-top:17px}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:17px}
    .metric{position:relative;min-height:116px;padding:18px;overflow:hidden}
    .metric:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--blue),#40b3df 68%,var(--green))}
    .metric:after{content:"";position:absolute;right:-17px;bottom:-28px;width:84px;height:84px;border-radius:50%;background:var(--metric-bg,#edf4ff)}
    .metric-label{color:var(--muted);font-size:11px}
    .metric-value{margin:8px 0 3px;font-size:28px;font-weight:800;letter-spacing:-.6px}
    .metric-foot{color:var(--green);font-size:10px}
    .metric-foot.warn{color:var(--orange)}
    .focus-banner{position:relative;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-bottom:17px;padding:20px 23px;border:1px solid #bfe2ef;border-radius:var(--radius);background:linear-gradient(105deg,#e9f8fd,#f9fcfd 62%,#f2f9e9);overflow:hidden}
    .focus-banner:after{content:"5G+";position:absolute;right:145px;top:-26px;color:rgba(0,133,208,.07);font-size:82px;font-weight:900;letter-spacing:-6px;transform:rotate(-5deg)}
    .focus-banner>*{position:relative;z-index:1}
    .focus-banner h2{margin:0 0 5px;font-size:17px}
    .focus-banner p{margin:0;color:#5f7189;font-size:12px}
    .focus-tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
    .focus-tag{padding:4px 8px;border:1px solid #dce8f8;border-radius:6px;background:#fff;color:var(--blue);font-size:10px}
    .grid-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(310px,.85fr);gap:17px}
    .grid-equal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
    .list-row{display:grid;grid-template-columns:39px minmax(0,1fr) auto;gap:11px;align-items:center;padding:13px 19px;border-top:1px solid #edf0f5}
    .rank{width:29px;height:29px;display:grid;place-items:center;border-radius:8px;background:var(--blue-50);color:var(--blue);font-size:10px;font-weight:800}
    .list-title{font-weight:800}
    .list-meta{margin-top:3px;color:var(--muted);font-size:10px}
    .score{text-align:right}
    .score strong{display:block;color:var(--orange);font-size:20px}
    .score span{color:var(--muted);font-size:9px}
    .todo-row{display:flex;gap:10px;padding:12px 19px;border-top:1px solid #edf0f5}
    .todo-dot{width:9px;height:9px;flex:none;margin-top:5px;border-radius:50%;background:var(--orange)}
    .todo-title{font-weight:700;font-size:12px}
    .todo-meta{margin-top:3px;color:var(--muted);font-size:10px}
    .alert-list{padding:0 13px 13px}
    .alert-item{display:flex;gap:9px;width:100%;margin-top:8px;padding:11px;border:0;border-radius:9px;background:#f8faff;color:#55667c;text-align:left;font-size:11px}
    .alert-item.warning{background:var(--orange-50)}
    .alert-item.danger{background:var(--red-50)}
    .alert-icon{width:23px;height:23px;display:grid;place-items:center;flex:none;border-radius:6px;background:#fff;color:var(--orange);font-weight:800}
    .filterbar{display:flex;align-items:center;gap:9px;padding:13px 15px;margin-bottom:14px;flex-wrap:wrap}
    .search-box{display:flex;align-items:center;gap:7px;min-width:230px;flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
    .search-box input{width:100%;border:0;outline:0;background:transparent}
    .select,.input,.textarea{width:100%;border:1px solid #dce3ec;border-radius:8px;background:#fff;color:var(--ink);outline:0}
    .select,.input{height:38px;padding:0 10px}
    .textarea{min-height:90px;padding:10px;resize:vertical}
    .select:focus,.input:focus,.textarea:focus{border-color:#83b1f1;box-shadow:0 0 0 3px #edf5ff}
    .filter-select{width:auto;min-width:120px}
    .opportunity-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    .opp-card{position:relative;padding:18px;overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
    .opp-card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--blue),#4fb5df 70%,var(--green))}
    .opp-card:hover{transform:translateY(-3px);border-color:#b9dce9;box-shadow:0 16px 34px rgba(0,104,155,.11)}
    .opp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
    .opp-name{font-weight:800;line-height:1.45}
    .opp-score{min-width:45px;height:45px;display:grid;place-items:center;border-radius:11px;background:var(--orange-50);color:var(--orange);font-size:18px;font-weight:800}
    .opp-reason{min-height:56px;margin:11px 0;padding:9px;border-radius:8px;background:#f7f9fc;color:#607089;font-size:10px;line-height:1.65}
    .opp-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
    .opp-actions .btn{width:100%;min-width:0}
    .opp-actions .btn-quick{border-color:#6fae24;background:linear-gradient(135deg,#8acb35,#6fae24);color:#fff;box-shadow:0 7px 16px rgba(112,174,36,.2)}
    .opp-actions .btn-quick:hover{border-color:#5d981c;background:linear-gradient(135deg,#7dbb2b,#619f20);color:#fff}
    .opp-actions .btn-created{border-color:#bcd9a0;background:#f5faee;color:#5d8f22}
    .badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:#eef2f7;color:#627086;font-size:9px;font-weight:800;white-space:nowrap}
    .badge.blue{background:var(--blue-50);color:var(--blue)}
    .badge.green{background:var(--green-50);color:var(--green)}
    .badge.orange{background:var(--orange-50);color:var(--orange)}
    .badge.red{background:var(--red-50);color:var(--red)}
    .badge.purple{background:#f1edff;color:var(--purple)}
    .tag{display:inline-flex;margin:2px 2px 2px 0;padding:3px 6px;border-radius:5px;background:#f1f4f8;color:#617188;font-size:9px}
    .table-wrap{overflow:auto;border-radius:var(--radius)}
    table{width:100%;border-collapse:collapse;background:#fff}
    th{padding:10px 12px;background:#f8fafc;color:#78869a;font-size:10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
    td{padding:12px;color:#435269;font-size:11px;border-bottom:1px solid #edf0f4;vertical-align:middle}
    tbody tr:hover{background:#fbfcfe}
    .company-cell{min-width:205px;color:var(--ink);font-weight:800}
    .empty{padding:45px 18px;text-align:center;color:var(--muted)}
    .empty strong{display:block;margin-bottom:6px;color:var(--text);font-size:14px}
    .pager{display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:12px 15px;border-top:1px solid var(--line)}
    .tabs{display:flex;max-width:100%;gap:4px;padding:4px;overflow-x:auto;border-radius:9px;background:#edf1f6}
    .tab{padding:7px 10px;border:0;border-radius:7px;background:transparent;color:#657489;font-size:11px}
    .tab.active{background:#fff;color:var(--blue);font-weight:800;box-shadow:0 1px 4px rgba(27,48,78,.08)}
    .task-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    .task-card{padding:15px}
    .task-head{display:flex;justify-content:space-between;gap:9px}
    .task-date{margin:10px 0;padding:9px;border-radius:8px;background:#f7f9fc;color:#56677d;font-size:11px}
    .task-note{min-height:36px;color:var(--muted);font-size:10px}
    .funnel{display:flex;align-items:flex-end;gap:15px;height:220px;padding:16px 22px 21px}
    .funnel-col{flex:1;min-width:55px;text-align:center;color:var(--muted);font-size:10px}
    .funnel-bar{width:100%;min-height:18px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;border-radius:7px 7px 3px 3px;color:#fff;font-size:11px;font-weight:800;background:linear-gradient(180deg,#72a9fa,var(--blue))}
    .funnel-label{margin-top:6px;white-space:nowrap}
    .crm-guide{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin:0 0 15px}
    .crm-guide-step{position:relative;padding:12px 10px;border:1px solid #d7e7ef;border-radius:10px;background:linear-gradient(145deg,#fff,#f5fbfd);text-align:center}
    .crm-guide-step:not(:last-child):after{content:"›";position:absolute;z-index:2;right:-8px;top:50%;transform:translateY(-50%);color:#85abc0;font-size:20px;font-weight:900}
    .crm-guide-step i{width:25px;height:25px;display:grid;place-items:center;margin:0 auto 6px;border-radius:8px;background:var(--blue-50);color:var(--blue);font-style:normal;font-size:10px;font-weight:900}
    .crm-guide-step b{display:block;color:var(--ink);font-size:11px}.crm-guide-step span{display:block;margin-top:2px;color:var(--muted);font-size:9px}
    .crm-stage-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:0 18px 18px}
    .crm-stage-card{position:relative;padding:12px;border:1px solid #dfeaf0;border-radius:10px;background:#fff;text-align:left}
    .crm-stage-card:after{content:"";position:absolute;inset:0 auto 0 0;width:3px;border-radius:10px 0 0 10px;background:linear-gradient(var(--blue),var(--green))}
    .crm-stage-card b{display:block;color:var(--blue);font-size:17px}.crm-stage-card span{display:block;color:var(--muted);font-size:10px}.crm-stage-card small{display:block;margin-top:4px;color:#52677b;font-size:9px}
    .crm-flow-path{display:flex;align-items:stretch;gap:7px;margin-top:10px;overflow:auto;padding:2px 2px 8px}
    .crm-flow-node{position:relative;min-width:108px;flex:1;padding:10px;border:1px solid #dce8ee;border-radius:9px;background:#fff}
    .crm-flow-node:not(:last-child):after{content:"›";position:absolute;z-index:2;right:-8px;top:50%;transform:translateY(-50%);color:#8caec0;font-size:18px;font-weight:900}
    .crm-flow-node label{display:block;color:var(--muted);font-size:9px}.crm-flow-node b{display:block;margin-top:3px;color:var(--ink);font-size:11px}.crm-flow-node small{display:block;margin-top:3px;color:var(--blue);font-size:9px}
    .crm-history-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:14px}.crm-history-panel{padding:13px;border:1px solid #e3eaf0;border-radius:10px;background:#fbfcfd}.crm-history-panel h3{margin:0 0 10px;font-size:12px}
    .crm-direction{display:inline-flex;margin-left:5px;padding:2px 5px;border-radius:5px;background:#edf7fd;color:var(--blue);font-size:8px;font-weight:900}
    .crm-conversion{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;padding:0 18px 18px}.crm-conversion-card{padding:11px;border:1px solid #e0e8ef;border-radius:9px;background:#f9fbfc}.crm-conversion-card b{display:block;color:var(--blue);font-size:15px}.crm-conversion-card span{display:block;color:var(--muted);font-size:9px}.crm-conversion-card small{display:block;margin-top:4px;color:#4f6376;font-size:9px}
    .progress-row{display:grid;grid-template-columns:105px 1fr 44px;gap:9px;align-items:center;padding:8px 19px;color:#536277;font-size:11px}
    .progress{height:8px;overflow:hidden;border-radius:999px;background:#edf1f6}
    .progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),#4aa6f2)}
    .source-grid,.quality-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
    .source-card,.quality-card{padding:16px}
    .source-card strong,.quality-card strong{display:block;margin:7px 0 3px;font-size:20px}
    .source-card p,.quality-card p{margin:0;color:var(--muted);font-size:10px}
    .source-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:9px;background:var(--blue-50);color:var(--blue);font-weight:800}
    .detail-hero{padding:17px;border-radius:11px;background:linear-gradient(110deg,#eef5ff,#f9fbff)}
    .detail-title{display:flex;align-items:flex-start;justify-content:space-between;gap:11px}
    .detail-title h3{margin:0 0 5px;font-size:18px}
    .detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:13px}
    .kv{padding:10px;border:1px solid #edf0f5;border-radius:8px;background:#fff}
    .kv label{display:block;margin-bottom:3px;color:var(--muted);font-size:9px}
    .kv span{font-size:11px;font-weight:700}
    .brief-section{margin-top:12px;padding:12px;border-radius:9px;background:#f8faff}

        var editPayload={name:editData.name,industry:editData.industry||"待分类",contact:editData.contact,phone:editData.phone,need:editData.need,stage:editData.stage,potential:editData.potential,score:editCustomer.score,nextAction:editData.nextAction,isQianBaiWanGroup:customerFlag(editData.isQianBaiWanGroup),isKeyAccount:customerFlag(editData.isKeyAccount),stageReason:flowReason,version:editCustomer.backendVersion};
        if(ownershipChanged)editPayload.ownershipRequest={targetOrganizationId:targetBackendOrg.id,targetOwnerName:editData.owner,reason:flowReason};
        var savedCustomer;
        try{savedCustomer=await backendRequest("/customers/"+encodeURIComponent(editCustomer.id),{method:"PATCH",body:JSON.stringify(editPayload)});}
        catch(error){return toast(error.message||"客户资料保存或变更申请失败，操作未完成。","error");}
        var savedView=backendCustomerToFrontend(savedCustomer),savedIndex=state.customers.findIndex(function(item){return item.id===savedView.id;});
        if(savedIndex>=0)state.customers[savedIndex]=savedView;
        var refreshFailed=false;
        try{await refreshBackendCustomerDetail(editCustomer.id);if(ownershipChanged)await synchronizeBackendApprovals();}
        catch(error){refreshFailed=true;}
        closeModal();render();toast(refreshFailed?"客户资料已保存，但详情或审批列表刷新失败，请点击刷新共享客户。":ownershipChanged?"客户资料和归属申请已一并保存，原归属与客户经理待上级审批。":flowChanged?"CRM 流转已保存，阶段变化已留痕。":"客户资料已保存。",refreshFailed?"error":undefined);return;
      }
      if(e.target.id==="taskForm"){
        var t=Object.fromEntries(new FormData(e.target)),taskResult=await createVisitTask({customerId:t.customerId,owner:t.owner,time:t.time,method:t.method,purpose:t.purpose,notes:t.notes},"手工创建");if(!taskResult.ok)return;closeModal();ui.visitCustomerId=t.customerId;ui.route="visits";render();toast(taskResult.conflict?"已记录授权原因并创建任务。":"拜访任务已创建。");return;
      }
      if(e.target.getAttribute("id")==="taskEditForm"){
        var taskData=Object.fromEntries(new FormData(e.target)),task=state.visits.find(function(item){return item.id===taskData.id;}),taskCustomer=task?customer(task.customerId):null;
        if(!task||!taskCustomer||!canEdit()||!isOpenVisit(task))return toast("无权编辑已结束或范围外的任务。","error");
        var editTime=visitTimeValidation(taskData.time),cleanPurpose=String(taskData.purpose||"").trim();if(!editTime.ok)return toast(editTime.message,"error");if(cleanPurpose.length<2)return toast("请填写清晰的拜访任务目标。","error");
        if(scopedManagerChoices(taskCustomer.managingOrgId).indexOf(taskData.owner)<0)return toast("所选负责人不在当前可分配范围。","error");
        try{var oldOwner=task.owner,savedTask=await backendRequest("/visits/"+encodeURIComponent(task.id),{method:"PATCH",body:JSON.stringify({version:task.version,time:editTime.time,method:taskData.method,ownerName:taskData.owner,purpose:cleanPurpose,notes:String(taskData.notes||"").trim()})});await synchronizeBackendCustomers(false);await synchronizeBackendVisits(false);state.history.push({id:uid("h"),customerId:taskCustomer.id,time:savedTask.updatedAt,title:"拜访任务已调整",detail:currentUser.name+"将任务从 "+oldOwner+" 调整给 "+savedTask.owner+"，执行时间为 "+fmtDateTime(savedTask.time)+"。"});saveState();closeModal();render();toast("任务已更新并完成改派留痕。");}catch(error){toast(error.message||"任务调整失败。","error");}return;
      }
      if(e.target.getAttribute("id")==="cancelTaskForm"){
        var cancelData=Object.fromEntries(new FormData(e.target)),cancelResult=await cancelVisitTask(cancelData.id,cancelData.reason);if(!cancelResult.ok)return toast(cancelResult.message,"error");closeModal();render();toast("拜访任务已取消并保留操作记录。");return;
      }
      if(e.target.getAttribute("id")==="completeForm"){
        var completeResult=await completeVisitTask(Object.fromEntries(new FormData(e.target)));if(!completeResult.ok)return toast(completeResult.message,"error");closeModal();ui.route=completeResult.isDeal?"weekly":ui.route;render();toast(completeResult.isDeal?"成交已记录："+completeResult.visit.dealProduct+" · "+formatCurrency(completeResult.visit.dealAmount)+"。周经分已同步更新。":completeResult.aiHit?"拜访结果已保存，AI 整理内容已按确认写入客户档案。":"拜访结果已保存。");
      }
    });
    document.addEventListener("keydown",function(e){var layer=$("#modalLayer");if(e.key==="Escape"&&layer.classList.contains("show")){closeModal();return;}if(e.key==="Tab"&&layer.classList.contains("show")){var focusable=$$(".modal button:not([disabled]),.modal input:not([disabled]),.modal select:not([disabled]),.modal textarea:not([disabled]),.modal [tabindex]:not([tabindex=\"-1\"])").filter(function(item){return item.offsetParent!==null;}),first=focusable[0],last=focusable[focusable.length-1];if(!first)return;if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
    setupLogin();restoreBackendSession();
  })();
  </script>
